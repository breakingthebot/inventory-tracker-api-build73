name: Inventory Tracker API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore InventoryTracker.sln

    - name: Build Solution
      run: dotnet build InventoryTracker.sln --no-restore --configuration Release

    - name: Run Test Suite
      run: dotnet test InventoryTracker.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test_results.trx"
